<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Veckopeng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--soft:#5B6784;--bg:#EEF3FF;--card:#fff;--line:#D9E1F2;--gold:#FFB703;--gold2:#C98600;--ok:#1FA971;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.fd{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;margin:0}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.back{padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.btn{padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{background:#fff;color:#C0392B;border:1px solid #F0C4BE}
.btn.full{width:100%}
.muted{color:var(--soft);font-size:14px}
/* Hem */
.hero{padding:28px 0 20px}
.hero h1{font-size:44px;line-height:1}
.kidbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:22px 20px;margin-bottom:12px;border-radius:24px;color:#fff;text-align:left}
.kidbtn .fd{font-size:30px}
.kidbtn small{display:block;opacity:.9;font-size:14px}
.kidbtn .amt{font-family:Fredoka,sans-serif;font-size:28px}
.parentlink{display:block;margin:22px auto 0;padding:10px 16px;color:var(--soft);text-decoration:underline}
/* Sparbössa */
.jar{display:flex;gap:16px;align-items:center}
.jarbox{position:relative;width:104px;height:124px;border-radius:26px 26px 34px 34px;border:4px solid var(--ink);background:#fff;overflow:hidden;flex:none}
.jarbox::before{content:"";position:absolute;left:50%;top:0;width:44px;height:8px;margin-left:-22px;background:var(--ink);border-radius:0 0 8px 8px;z-index:2}
.fill{position:absolute;left:0;right:0;bottom:0;background:repeating-radial-gradient(circle at 12px 10px,var(--gold) 0 7px,var(--gold2) 7px 8px,var(--gold) 8px 14px);transition:height .5s}
.jarinfo .big{font-family:Fredoka,sans-serif;font-size:46px;line-height:1;font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
/* Dagar */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{padding:8px 0;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:center;font-size:13px}
.day b{display:block;font-family:Fredoka,sans-serif;font-size:15px}
.day.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.day.fut{opacity:.55}
.day.done b::after{content:" ✓";color:var(--ok)}
.day.sel.done b::after{color:var(--gold)}
/* Uppgifter */
.task{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:10px;border-radius:20px;background:#fff;border:2px solid var(--line);text-align:left}
.task .em{font-size:30px}
.task .tt{flex:1;font-family:Fredoka,sans-serif;font-size:19px}
.task .tt small{display:block;font-family:system-ui,sans-serif;font-size:14px;color:var(--soft)}
.chk{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
.task.on{border-color:var(--ok);background:#F0FBF6}
.task.on .chk{background:var(--ok);border-color:var(--ok)}
.task.on .tt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(20,33,61,.35)}
.task.lock{opacity:.5}
/* Förälder */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wk button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px}
.kh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.kh .fd{font-size:22px;flex:1}
.sum{font-family:Fredoka,sans-serif;font-size:22px}
.mx{width:100%;border-collapse:collapse;margin-top:8px}
.mx th{font-size:12px;color:var(--soft);font-weight:500;padding:2px 0}
.mx td{text-align:center;padding:2px 0}
.mx td:first-child{text-align:left;font-size:14px;padding-right:6px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);font-size:16px;color:#fff}
.cell.on{background:var(--ok);border-color:var(--ok)}
.cell.na{border:0;color:var(--line);cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-weight:600;font-size:14px;margin-top:8px}
input[type=text],input[type=number],input[type=password],input[type=tel]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font:inherit;background:#fff;margin-top:4px}
input[type=color]{width:44px;height:44px;border:0;background:none;padding:0}
.two{display:grid;grid-template-columns:90px 1fr;gap:10px}
.pin{max-width:260px;margin:40px auto;text-align:center}
.pin input{text-align:center;font-size:28px;letter-spacing:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.cell.wait{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.cell.bad{background:#E5484D;border-color:#E5484D}
.task.wait{border-color:var(--gold);background:#FFF8E6}
.task.wait .chk{border-color:var(--gold);background:#fff;font-size:18px}
.task.redo{border-color:#E5484D;background:#FFF1F1}
.task.redo .chk{background:#E5484D;border-color:#E5484D}
.pend{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
.pend img,.pend .ph{width:72px;height:72px;border-radius:12px;background:var(--line);flex:none}
.pend img{object-fit:cover;cursor:zoom-in}
.pend .ph{display:grid;place-items:center;font-size:26px}
.pend .grow{flex:1;min-width:0}
.pend .acts{display:flex;gap:6px;margin-top:6px}
.pend .btn{padding:8px 12px;font-size:14px}
.zoom{position:fixed;inset:0;background:rgba(20,33,61,.92);display:grid;place-items:center;padding:16px;z-index:8}
.zoom img{max-width:100%;max-height:100%;border-radius:14px}
.stat{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
.sw{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:400}
.sw input{width:22px;height:22px;flex:none}
.code{font-family:ui-monospace,monospace;background:var(--bg);padding:8px 10px;border-radius:10px;word-break:break-all;font-size:13px}
.own{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.own .btn{padding:8px 12px;font-size:14px;flex:none}
.cell:disabled,.btn:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script type="module">
/* ============ Firebase ============
   Klistra in din config här (se instruktionerna). Lämna null för lokalt läge (en telefon).
   const FIREBASE_CONFIG={apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}; */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCXbrMKoTQWIxS699fOfRsju9Lcz8AlztI",
  authDomain:"veckopeng-f5702.firebaseapp.com",
  projectId:"veckopeng-f5702",
  storageBucket:"veckopeng-f5702.firebasestorage.app",
  messagingSenderId:"675649694653",
  appId:"1:675649694653:web:96c1c9fc2d40edc5d040d4"
};
const FB='https://www.gstatic.com/firebasejs/10.12.2/';

/* ============ Hjälpare ============ */
const $=s=>document.querySelector(s);
const DAYS=['Mån','Tis','Ons','Tors','Fre','Lör','Sön'];
const KEY='veckopeng-v1',FAM_KEY='veckopeng-fam';
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monday=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayIdx=()=>(new Date().getDay()+6)%7;
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const weekKey=off=>fmt(addDays(monday(),off*7));
const isoWeek=d=>{const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);return Math.ceil(((x-new Date(Date.UTC(x.getUTCFullYear(),0,1)))/864e5+1)/7)};
const kr=n=>`${n} kr`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
const hp=async(p,s=fam||'')=>{if(!crypto.subtle)return p;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')};

/* ============ Data ============
   done[nyckel] = {s:1 väntar | 2 godkänd | 3 gör om, t:tid, p:foto}
   nyckel = vecka|barn|uppgift|dag */
const Store={
  load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
  save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
};
function defaults(){
  const k=['sakris','sally'];
  return{v:2,cfgT:0,bonus:10,approve:true,odd:'pappa',wo:{},parents:[{id:'pappa',n:'Pappa',pin:''},{id:'mamma',n:'Mamma',pin:''}],
    kids:[{id:'sakris',n:'Sakris',c:'#2F6BFF'},{id:'sally',n:'Sally',c:'#E5408A'}],
    tasks:[
      {id:'t1',t:'Duka av bordet',e:'🍽️',v:2,d:[0,1,2,3,4],k},
      {id:'t2',t:'Plocka ur diskmaskinen',e:'🫧',v:5,d:[0,2,4],k,p:true},
      {id:'t3',t:'Gå ut med soporna',e:'🗑️',v:5,d:[1,5],k},
      {id:'t4',t:'Städa rummet',e:'🧹',v:10,d:[5],k,p:true},
      {id:'t5',t:'Läsa 15 minuter',e:'📚',v:1,d:[0,1,2,3,4],k}],
    done:{},paid:{}};
}
let S=Store.load()||defaults();
S.approve??=true;S.odd??='pappa';S.wo??={};S.parents??=[{id:'pappa',n:'Pappa',pin:S.pin||''},{id:'mamma',n:'Mamma',pin:''}];
for(const m of['done','paid'])for(const k in S[m]){const r=S[m][k];if(Array.isArray(r))S[m][k]={s:m==='done'?(r[0]?2:0):r[0],t:r[1]}}
const commit=()=>Store.save(S);
const ui={me:null,mode:'home',kid:null,day:null,ok:false,tab:'over',off:0,edit:null,zoom:null};
let fam=localStorage.getItem(FAM_KEY)||null;

const kidOf=id=>S.kids.find(k=>k.id===id);
const parentOf=id=>S.parents.find(p=>p.id===id);
const other=id=>S.parents.find(p=>p.id!==id).id;
const owner=w=>S.wo[w]||(isoWeek(new Date(w+'T00:00:00'))%2===1?S.odd:other(S.odd));
const slots=kid=>S.tasks.filter(t=>t.k.includes(kid)).flatMap(t=>t.d.map(d=>({t,d})));
const dk=(w,k,t,d)=>`${w}|${k}|${t}|${d}`;
const status=(w,k,t,d)=>(S.done[dk(w,k,t,d)]||{}).s||0;
const isPaid=(w,k)=>(S.paid[w+'|'+k]||{}).s===1;
function stats(kid,w){
  let total=0,earned=0,pend=0,n=0;const sl=slots(kid);
  sl.forEach(({t,d})=>{total+=t.v;const s=status(w,kid,t.id,d);if(s===2){earned+=t.v;n++}else if(s===1)pend+=t.v});
  const all=sl.length>0&&n===sl.length,bonus=all?S.bonus:0;
  return{total,earned,pend,n,count:sl.length,all,bonus,sum:earned+bonus,max:total+S.bonus};
}

/* ============ Synk (Firestore) ============ */
let cloud=null,cstate=!FIREBASE_CONFIG?'off':fam?'connecting':'setup';
const cfgOf=()=>({kids:S.kids,tasks:S.tasks,bonus:S.bonus,approve:S.approve,parents:S.parents,odd:S.odd,wo:S.wo,cfgT:S.cfgT});
function applyCfg(c){if(c.cfgT>S.cfgT){Object.assign(S,c);commit()}}
function saveCfg(){S.cfgT=Date.now();commit();cloud&&cloud.cfg().catch(()=>{cstate='err'})}
function setRec(m,key,r){S[m][key]=r;commit();cloud&&cloud.rec(m,key,r).catch(()=>{cstate='err';soft()})}
function soft(){const a=document.activeElement;if(ui.edit||(a&&/INPUT|TEXTAREA/.test(a.tagName)))return;render()}
async function startCloud(){
  if(!FIREBASE_CONFIG||!fam||cloud)return;
  cstate='connecting';
  try{
    const[A,F,U]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-firestore.js'),import(FB+'firebase-auth.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    await U.signInAnonymously(U.getAuth(app));
    const db=F.getFirestore(app);
    cloud={
      cfg:()=>F.setDoc(F.doc(db,'families',fam),{cfg:JSON.stringify(cfgOf())}),
      rec:(m,k,r)=>F.setDoc(F.doc(db,'families',fam,m,k),r)
    };
    F.onSnapshot(F.doc(db,'families',fam),s=>{
      if(s.exists())applyCfg(JSON.parse(s.data().cfg));else cloud.cfg();
      cstate='on';soft();
    },()=>{cstate='err';soft()});
    for(const m of['done','paid'])F.onSnapshot(F.collection(db,'families',fam,m),s=>{
      s.docChanges().forEach(c=>{if(c.type==='removed')delete S[m][c.doc.id];else S[m][c.doc.id]=c.doc.data()});
      commit();soft();
    });
  }catch(e){cstate='err';console.error(e);soft()}
}
function joinFam(c){S=defaults();commit();fam=c;localStorage.setItem(FAM_KEY,c);cstate='connecting'}
if(FIREBASE_CONFIG&&location.hash.startsWith('#f=')){
  const c=location.hash.slice(3);history.replaceState(null,'',location.pathname+location.search);
  if(c&&c!==fam)joinFam(c);
}

/* ============ Foto ============ */
const pick=()=>new Promise(res=>{
  const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.style.display='none';
  document.body.appendChild(i);
  i.onchange=()=>{res(i.files[0]||null);i.remove()};
  i.addEventListener('cancel',()=>{res(null);i.remove()});
  i.click();
});
const shrink=f=>new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const r=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};
  img.onerror=no;img.src=u;
});

/* ============ Vyer ============ */
const CS={off:'Lokalt läge – data finns bara på den här telefonen',connecting:'Ansluter…',on:'● Synkad',err:'Ingen kontakt – sparar på telefonen tills vidare'};
function homeView(){
  if(cstate==='setup')return`<div class="hero"><h1>Veckopeng 🪙</h1><p class="muted">Koppla den här telefonen till familjen.</p></div>
  <div class="card"><h3>Är du förälder?</h3><p class="muted" style="margin:4px 0 12px">Skapa familjen första gången. Därefter delar du en länk till barnens telefoner.</p><button class="btn gold full" data-a="newfam">Skapa ny familj</button></div>
  <div class="card"><h3>Har du en familjekod?</h3><p class="muted" style="margin:4px 0 12px">Eller öppna länken du fått.</p><button class="btn alt full" data-a="joinfam">Skriv in kod</button></div>`;
  const w=weekKey(0);
  return`<div class="hero"><h1>Veckopeng 🪙</h1><p class="muted">Vem är du?</p></div>`+
  S.kids.map(k=>{const s=stats(k.id,w);
    return`<button class="kidbtn" style="background:${k.c}" data-a="kid" data-v="${k.id}">
      <span><span class="fd">${esc(k.n)}</span><small>${s.n} av ${s.count} godkända${s.pend?` · ${kr(s.pend)} väntar`:''}</small></span>
      <span class="amt">${kr(s.sum)}</span></button>`}).join('')+
  `<button class="parentlink" data-a="parent">Förälder</button><div class="stat">${CS[cstate]}</div>`;
}

function kidView(){
  const k=kidOf(ui.kid),w=weekKey(0),s=stats(k.id,w),ti=todayIdx(),sel=ui.day??ti;
  const pct=s.max?Math.min(100,s.sum/s.max*100):0,dn=x=>x===1||x===2;
  const strip=DAYS.map((n,d)=>{
    const ds=slots(k.id).filter(x=>x.d===d),c=ds.filter(x=>dn(status(w,k.id,x.t.id,d))).length;
    return`<button class="day${d===sel?' sel':''}${d>ti?' fut':''}${ds.length&&c===ds.length?' done':''}" data-a="day" data-v="${d}">${n}<b>${ds.length?c+'/'+ds.length:'–'}</b></button>`}).join('');
  const list=slots(k.id).filter(x=>x.d===sel).map(({t})=>{
    const st=status(w,k.id,t.id,sel),lock=sel>ti||st===2;
    const cls=st===2?' on':st===1?' wait':st===3?' redo':'',mark=st===2?'✓':st===1?'⏳':st===3?'↻':'';
    const sub=st===1?'Väntar på godkännande':st===3?'Gör om':`+${kr(t.v)}${t.p?' · 📷 ta foto':''}`;
    return`<button class="task${cls}${sel>ti?' lock':''}" ${lock?'disabled':''} data-a="tick" data-k="${k.id}" data-t="${t.id}" data-d="${sel}" data-w="${w}">
      <span class="em">${t.e}</span><span class="tt">${esc(t.t)}<small>${sub}</small></span><span class="chk">${mark}</span></button>`}).join('')
    ||`<p class="muted" style="text-align:center;padding:24px 0">Inget att göra den här dagen 🎉</p>`;
  const bonusTxt=!S.bonus?'':s.all?`🎉 Bonus: +${kr(S.bonus)}`:`Klara allt i veckan: +${kr(S.bonus)} extra`;
  return`<div class="top"><button class="back" data-a="home">← Byt</button><h2 style="color:${k.c}">${esc(k.n)}</h2><span style="width:64px"></span></div>
  <p class="muted" style="text-align:center;margin:-6px 0 12px">Den här veckan: hos ${esc(parentOf(owner(w)).n)}</p><div class="card jar"><div class="jarbox"><div class="fill" style="height:${pct}%"></div></div>
    <div class="jarinfo"><div class="muted">Godkänt hittills</div><div class="big">${kr(s.sum)}</div>
    <div class="muted">${s.pend?`+ ${kr(s.pend)} väntar · `:''}av ${kr(s.max)}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div>
  ${bonusTxt?`<p class="muted" style="margin:-4px 4px 12px">${bonusTxt}</p>`:''}
  <div class="days">${strip}</div>${list}<div class="stat">${CS[cstate]}</div>`;
}

function pinView(){
  const back=`<div class="top"><button class="back" data-a="home">← Tillbaka</button></div>`;
  if(!ui.me)return back+`<div class="pin"><h2>Vem är du?</h2><p class="muted">Föräldraläge</p>`+S.parents.map(p=>`<button class="btn full" style="margin-top:10px" data-a="pickme" data-v="${p.id}">${esc(p.n)}</button>`).join('')+`</div>`;
  const p=parentOf(ui.me),first=!p.pin;
  return back+`<div class="pin"><h2>${first?'Välj en PIN':'Ange PIN'}</h2><p class="muted">${esc(p.n)}${first?' – 4 siffror som bara du använder.':''}</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" autofocus>
  <button class="btn full" style="margin-top:14px" data-a="pin">${first?'Spara PIN':'Öppna'}</button>
  ${first?'':`<button class="parentlink" data-a="resetpin">Glömt PIN?</button>`}
  <button class="parentlink" style="margin-top:4px" data-a="pickme" data-v="">Inte du?</button></div>`;
}

function parentView(){
  const tabs=[['over','Översikt'],['upg','Uppgifter'],['set','Inställningar']];
  return`<div class="top"><button class="back" data-a="home">← Ut</button><h2>${esc(parentOf(ui.me).n)}</h2><span style="width:64px"></span></div>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="${ui.tab===k?'on':''}" data-a="ptab" data-v="${k}">${n}</button>`).join('')}</div>`+
  (ui.tab==='over'?overView():ui.tab==='upg'?taskView():setView());
}

function pendView(){
  const all=Object.entries(S.done).filter(([,r])=>r.s===1).sort((a,b)=>a[1].t-b[1].t);
  const L=all.filter(([key])=>owner(key.split('|')[0])===ui.me),rest=all.length-L.length;
  const note=rest?`<p class="muted" style="margin:0 4px 12px">${rest} väntar hos ${esc(parentOf(other(ui.me)).n)}</p>`:'';
  if(!L.length)return note;
  return note+`<div class="card"><h3>Att godkänna (${L.length})</h3>`+L.map(([key,r])=>{
    const[w,k,t,d]=key.split('|'),kid=kidOf(k),task=S.tasks.find(x=>x.id===t);
    if(!kid||!task)return'';
    const dt=addDays(new Date(w+'T00:00:00'),+d);
    return`<div class="pend">${r.p?`<img src="${r.p}" alt="Foto" data-a="zoom" data-v="${esc(key)}">`:`<span class="ph">${task.e}</span>`}
      <div class="grow"><b style="color:${kid.c}">${esc(kid.n)}</b> · ${esc(task.t)}<div class="muted">${DAYS[+d]} ${dt.getDate()}/${dt.getMonth()+1} · ${kr(task.v)}</div>
      <div class="acts"><button class="btn gold" data-a="appr" data-v="${esc(key)}">Godkänn</button><button class="btn alt" data-a="redo" data-v="${esc(key)}">Gör om</button></div></div></div>`}).join('')+`</div>`;
}

function overView(){
  const w=weekKey(ui.off),mon=addDays(monday(),ui.off*7),sun=addDays(mon,6),ow=parentOf(owner(w)),mine=ow.id===ui.me;
  const rng=`${mon.getDate()}/${mon.getMonth()+1} – ${sun.getDate()}/${sun.getMonth()+1}`;
  return pendView()+`<div class="wk"><button data-a="wk" data-v="-1" aria-label="Förra veckan">‹</button>
    <div style="text-align:center"><h3>Vecka ${isoWeek(mon)}</h3><div class="muted">${rng}${ui.off===0?' · nu':''}</div></div>
    <button data-a="wk" data-v="1" aria-label="Nästa vecka" ${ui.off>=0?'disabled style="opacity:.35"':''}>›</button></div>
  <div class="card own"><span>Hos <b>${esc(ow.n)}</b> den här veckan${mine?'':` – bara ${esc(ow.n)} kan godkänna`}</span><button class="btn alt" data-a="swapwk" data-v="${w}">Byt till ${esc(parentOf(other(ow.id)).n)}</button></div>`+
  S.kids.map(k=>{
    const s=stats(k.id,w),paid=isPaid(w,k.id);
    const rows=S.tasks.filter(t=>t.k.includes(k.id)).map(t=>`<tr><td>${t.e} ${esc(t.t)}</td>`+
      DAYS.map((_,d)=>{
        if(!t.d.includes(d))return`<td><span class="cell na">·</span></td>`;
        const st=status(w,k.id,t.id,d),c=st===2?' on':st===1?' wait':st===3?' bad':'';
        return`<td><button class="cell${c}" ${mine?'':'disabled'} data-a="ptick" data-k="${k.id}" data-t="${t.id}" data-d="${d}" data-w="${w}" aria-label="${esc(t.t)} ${DAYS[d]}">${st===2?'✓':st===1?'⏳':st===3?'✕':''}</button></td>`}).join('')+`</tr>`).join('');
    return`<div class="card"><div class="kh"><span class="dot" style="background:${k.c}"></span><span class="fd">${esc(k.n)}</span><span class="sum">${kr(s.sum)}</span></div>
      <div class="muted">${s.n} av ${s.count} godkända${s.pend?` · ${kr(s.pend)} väntar`:''}${S.bonus?` · bonus ${kr(s.bonus)}`:''}</div>
      <div class="bar"><i style="width:${s.count?s.n/s.count*100:0}%"></i></div>
      <table class="mx"><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>${rows}</table>
      <button class="btn ${paid?'alt':'gold'} full" ${mine?'':'disabled'} style="margin-top:12px" data-a="paid" data-k="${k.id}" data-w="${w}">${paid?'✓ Utbetalt – ångra':`Markera ${kr(s.sum)} som utbetalt`}</button></div>`}).join('');
}

function taskView(){
  if(ui.edit)return editForm();
  const per=S.kids.map(k=>`${esc(k.n)} ${kr(slots(k.id).reduce((a,x)=>a+x.t.v,0))}`).join(' · ');
  return`<div class="card"><h3>Veckoschema</h3><p class="muted" style="margin:4px 0 0">Värde per vecka: ${per}${S.bonus?` (+${kr(S.bonus)} bonus)`:''}</p></div>
  <div class="card">${S.tasks.map(t=>`<div class="row"><span style="font-size:26px">${t.e}</span>
    <div class="grow"><b>${esc(t.t)}</b><div class="muted">${kr(t.v)}${t.p?' · 📷':''} · ${t.d.length===7?'varje dag':t.d.map(d=>DAYS[d]).join(', ')||'ingen dag'} · ${t.k.map(i=>esc((kidOf(i)||{n:'?'}).n)).join(', ')||'ingen'}</div></div>
    <button class="btn alt" data-a="edit" data-v="${t.id}">Ändra</button></div>`).join('')||'<p class="muted">Inga uppgifter än.</p>'}</div>
  <button class="btn full" data-a="edit" data-v="new">+ Ny uppgift</button>`;
}

function editForm(){
  const t=ui.edit;
  return`<div class="card"><h3>${t.isNew?'Ny uppgift':'Ändra uppgift'}</h3>
  <div class="two"><div><label for="f-e">Ikon</label><input id="f-e" type="text" value="${esc(t.e)}" maxlength="4"></div>
  <div><label for="f-t">Vad ska göras?</label><input id="f-t" type="text" value="${esc(t.t)}"></div></div>
  <label for="f-v">Värde (kr)</label><input id="f-v" type="number" inputmode="decimal" min="0" step="1" value="${t.v}">
  <label>Vilka dagar?</label><div class="chips">${DAYS.map((n,d)=>`<button class="chip${t.d.includes(d)?' on':''}" data-a="togd" data-v="${d}">${n}</button>`).join('')}</div>
  <label>Vem?</label><div class="chips">${S.kids.map(k=>`<button class="chip${t.k.includes(k.id)?' on':''}" data-a="togk" data-v="${k.id}">${esc(k.n)}</button>`).join('')}</div>
  <label>Bevis</label><div class="chips"><button class="chip${t.p?' on':''}" data-a="togp">📷 Kräver foto</button></div>
  <div style="display:flex;gap:8px"><button class="btn full" data-a="save">Spara</button><button class="btn alt" data-a="cancel">Avbryt</button></div>
  ${t.isNew?'':`<button class="btn red full" style="margin-top:10px" data-a="del">Ta bort uppgiften</button>`}</div>`;
}

function setView(){
  const famCard=!FIREBASE_CONFIG
   ?`<p class="muted" style="margin:4px 0 0">Lokalt läge: data finns bara på den här telefonen. Lägg in din Firebase-config överst i filen för att synka.</p>`
   :`<p class="muted" style="margin:4px 0 8px">${CS[cstate]}</p><div class="code">${esc(fam||'–')}</div>
     <button class="btn gold full" style="margin-top:12px" data-a="invite">Skicka länk till barnens telefoner</button>`;
  return`<div class="card"><h3>Barn</h3>${S.kids.map(k=>`<div class="row"><input type="color" value="${k.c}" data-s="c" data-k="${k.id}" aria-label="Färg"><input type="text" value="${esc(k.n)}" data-s="n" data-k="${k.id}" style="margin:0" aria-label="Namn"></div>`).join('')}</div>
  <div class="card"><h3>Föräldrar</h3>${S.parents.map(p=>`<div class="row"><input type="text" value="${esc(p.n)}" data-s="pn" data-k="${p.id}" style="margin:0" aria-label="Namn"></div>`).join('')}
  <label>Udda veckor (1, 3, 5 …) är hos</label><div class="chips">${S.parents.map(p=>`<button class="chip${S.odd===p.id?' on':''}" data-a="odd" data-v="${p.id}">${esc(p.n)}</button>`).join('')}</div>
  <p class="muted" style="margin:0">Enskilda veckor byter du i Översikt.</p></div>
  <div class="card"><h3>Godkännande</h3><label class="sw"><input type="checkbox" data-s="approve" ${S.approve?'checked':''}>Pengar räknas först när jag godkänner</label>
  <p class="muted" style="margin:6px 0 0">Uppgifter som kräver foto måste alltid godkännas.</p></div>
  <div class="card"><h3>Bonus</h3><p class="muted" style="margin:4px 0 0">Extra pengar om alla veckans uppgifter är godkända. 0 = ingen bonus.</p>
  <label for="bonus">Bonus (kr)</label><input id="bonus" type="number" inputmode="decimal" min="0" value="${S.bonus}" data-s="bonus"></div>
  <div class="card"><h3>Familj och synk</h3>${famCard}</div>
  <div class="card"><h3>Övrigt</h3><button class="btn alt full" data-a="newpin">Byt min PIN</button>
  <button class="btn red full" style="margin-top:10px" data-a="reset">Lämna familjen och nollställ den här telefonen</button></div>`;
}

function render(){
  const zp=ui.zoom&&S.done[ui.zoom]&&S.done[ui.zoom].p;
  $('#app').innerHTML=(ui.mode==='kid'?kidView():ui.mode==='parent'?(ui.ok?parentView():pinView()):homeView())+
    (zp?`<div class="zoom" data-a="unzoom"><img src="${zp}" alt="Foto"></div>`:'');
}

/* ============ Händelser ============ */
function readForm(){
  if(!ui.edit||!$('#f-t'))return;
  ui.edit.t=$('#f-t').value;ui.edit.e=$('#f-e').value;ui.edit.v=Math.max(0,+$('#f-v').value||0);
}
const flip=(a,v)=>a.includes(v)?a.filter(x=>x!==v):[...a,v];
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v,D=el.dataset;
  switch(a){
    case'home':ui.mode='home';ui.ok=false;ui.me=null;ui.edit=null;break;
    case'kid':ui.mode='kid';ui.kid=v;ui.day=null;break;
    case'day':ui.day=+v;break;
    case'tick':{
      const key=dk(D.w,D.k,D.t,D.d),task=S.tasks.find(x=>x.id===D.t),st=status(D.w,D.k,D.t,+D.d);
      if(st===1){setRec('done',key,{s:0,t:Date.now()});break}
      let p;
      if(task.p){
        const f=await pick();if(!f)return;
        try{p=await shrink(f)}catch(x){toast('Kunde inte läsa fotot');return}
      }
      setRec('done',key,{s:(S.approve||task.p)?1:2,t:Date.now(),...(p?{p}:{})});
      toast(S.approve||task.p?'Skickat för godkännande':'Klart!');break}
    case'ptick':{if(owner(D.w)!==ui.me){toast('Veckan tillhör '+parentOf(owner(D.w)).n);return}const key=dk(D.w,D.k,D.t,D.d),st=status(D.w,D.k,D.t,+D.d);setRec('done',key,{s:st===0||st===1?2:0,t:Date.now(),by:ui.me});break}
    case'appr':{const w=v.split('|')[0];if(owner(w)!==ui.me){toast('Veckan tillhör '+parentOf(owner(w)).n);return}setRec('done',v,{s:2,t:Date.now(),by:ui.me});break}
    case'redo':{const w=v.split('|')[0];if(owner(w)!==ui.me){toast('Veckan tillhör '+parentOf(owner(w)).n);return}setRec('done',v,{s:3,t:Date.now(),by:ui.me});break}
    case'zoom':ui.zoom=v;break;
    case'unzoom':ui.zoom=null;break;
    case'parent':ui.mode='parent';break;
    case'pickme':ui.me=v||null;break;
    case'pin':{const val=$('#pin').value,p=parentOf(ui.me);
      if(!p.pin){if(!/^\d{4}$/.test(val)){toast('PIN ska vara 4 siffror');return}p.pin=await hp(val);saveCfg();ui.ok=true}
      else if((await hp(val))===p.pin||(await hp(val,''))===p.pin||val===p.pin)ui.ok=true;else{toast('Fel PIN');return}break}
    case'resetpin':{const me=parentOf(ui.me),o=parentOf(other(me.id));
      if(!o.pin){toast(`${o.n} måste först välja en egen PIN`);return}
      const x=prompt(`Skriv PIN för ${o.n} för att nollställa PIN för ${me.n}:`);if(x===null)return;
      if((await hp(x))===o.pin||(await hp(x,''))===o.pin||x===o.pin){me.pin='';saveCfg();toast('PIN nollställd – välj en ny');break}
      toast('Fel PIN');return}
    case'swapwk':S.wo[v]=other(owner(v));saveCfg();break;
    case'odd':S.odd=v;saveCfg();break;
    case'ptab':ui.tab=v;ui.edit=null;break;
    case'wk':ui.off=Math.min(0,ui.off+ +v);break;
    case'paid':if(owner(D.w)!==ui.me)return;setRec('paid',D.w+'|'+D.k,{s:isPaid(D.w,D.k)?0:1,t:Date.now()});break;
    case'edit':ui.edit=v==='new'?{isNew:true,id:uid(),t:'',e:'⭐',v:5,d:[0,1,2,3,4,5,6],k:S.kids.map(k=>k.id),p:false}:JSON.parse(JSON.stringify(S.tasks.find(t=>t.id===v)));break;
    case'togd':readForm();ui.edit.d=flip(ui.edit.d,+v);break;
    case'togk':readForm();ui.edit.k=flip(ui.edit.k,v);break;
    case'togp':readForm();ui.edit.p=!ui.edit.p;break;
    case'cancel':ui.edit=null;break;
    case'save':{readForm();const t=ui.edit;
      if(!t.t.trim()){toast('Skriv vad som ska göras');return}
      const o={id:t.id,t:t.t.trim(),e:t.e||'⭐',v:t.v,d:[...t.d].sort(),k:t.k,p:!!t.p};
      const i=S.tasks.findIndex(x=>x.id===t.id);i<0?S.tasks.push(o):S.tasks[i]=o;
      saveCfg();ui.edit=null;toast('Sparat');break}
    case'del':if(!confirm('Ta bort uppgiften?'))return;S.tasks=S.tasks.filter(t=>t.id!==ui.edit.id);saveCfg();ui.edit=null;break;
    case'newfam':{
      fam=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('');
      localStorage.setItem(FAM_KEY,fam);await startCloud();
      if(cloud){for(const m of['done','paid'])for(const k in S[m])cloud.rec(m,k,S[m][k]).catch(()=>{});saveCfg()}
      break}
    case'joinfam':{const c=(prompt('Skriv familjekoden:')||'').trim();if(!c)return;joinFam(c);await startCloud();break}
    case'invite':{
      const url=location.href.split('#')[0]+'#f='+fam;
      try{if(navigator.share){await navigator.share({title:'Veckopeng',url});return}await navigator.clipboard.writeText(url);toast('Länken är kopierad')}
      catch(x){if(x&&x.name!=='AbortError')prompt('Kopiera länken:',url)}
      return}
    case'newpin':{const p=prompt('Ny PIN (4 siffror):');if(p===null)return;if(!/^\d{4}$/.test(p)){toast('PIN ska vara 4 siffror');return}parentOf(ui.me).pin=await hp(p);saveCfg();toast('PIN bytt');return}
    case'reset':if(!confirm('Nollställa den här telefonen och lämna familjen? Data i molnet raderas inte.'))return;
      localStorage.removeItem(KEY);localStorage.removeItem(FAM_KEY);location.reload();return;
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target,s=el.dataset.s;if(!s)return;
  if(s==='bonus')S.bonus=Math.max(0,+el.value||0);
  else if(s==='approve')S.approve=el.checked;
  else if(s==='pn'){const p=parentOf(el.dataset.k);if(p)p.n=el.value.trim()||p.n}
  else{const k=kidOf(el.dataset.k);if(k)k[s]=el.value.trim()||k[s]}
  saveCfg();
});
startCloud();
render();
</script>
</body>
</html>
